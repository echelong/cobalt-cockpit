name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobalt-cockpit-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    # Mark this job ("Secret scan / Gitleaks") as a required status check in the
    # branch protection of main so that a leak blocks the merge.
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history and working tree
        shell: bash
        env:
          GITLEAKS_ARTIFACTS: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          # Findings are redacted (values never printed) and no report is uploaded.
          scripts/scan-secrets.sh
